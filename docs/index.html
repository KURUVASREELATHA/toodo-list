<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Stack To-Do List</title>
    
    <style>
        /* Basic CSS for presentation */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 40px; }
        #todo-container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); width: 100%; max-width: 450px; }
        h1 { text-align: center; color: #333; }
        .input-section { display: flex; margin-bottom: 20px; }
        #task-input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px 0 0 5px; font-size: 16px; }
        #add-button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 0 5px 5px 0; }
        #add-button:hover { background-color: #0056b3; }
        #task-list { list-style: none; padding: 0; }
        #task-list li { background: #e9ecef; padding: 12px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .remove-btn { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .remove-btn:hover { background: #c82333; }
    </style>
</head>
<body>
    <div id="todo-container">
        <h1>Full-Stack To-Do List 🚀</h1>
        <div class="input-section">
            <input type="text" id="task-input" placeholder="Enter a new task...">
            <button id="add-button" onclick="addTask()">Add Task</button>
        </div>
        <ul id="task-list">
            </ul>
    </div>

    <script>
        // Load tasks when the page is ready
        document.addEventListener('DOMContentLoaded', fetchTasks);
        
        const taskList = document.getElementById('task-list');
        const taskInput = document.getElementById('task-input');

        // --- Load tasks ---
        async function fetchTasks() {
            try {
                const response = await fetch('/api/tasks', { 
                    method: 'GET',
                    timeout: 3000 
                });
                if (response.ok) {
                    const tasks = await response.json();
                    taskList.innerHTML = ''; 
                    tasks.forEach(task => displayTask(task));
                    return;
                }
            } catch (error) {
                console.log('Using local storage');
            }
            const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            taskList.innerHTML = ''; 
            tasks.forEach(task => displayTask(task));
        }

        // --- Add a new task ---
        async function addTask() {
            const text = taskInput.value.trim();
            if (text === "") return;

            const newTask = {
                _id: Date.now().toString(),
                text: text,
                createdAt: new Date()
            };

            displayTask(newTask);
            taskInput.value = '';
            taskInput.focus();

            try {
                await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text }),
                    timeout: 3000
                });
            } catch (error) {
                const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
                tasks.unshift(newTask);
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }
        }

        // --- Delete a task ---
        async function removeTask(taskId, listItemElement) {
            listItemElement.remove();
            
            try {
                await fetch(`/api/tasks/${taskId}`, { 
                    method: 'DELETE',
                    timeout: 3000 
                });
            } catch (error) {
                const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
                const filteredTasks = tasks.filter(task => task._id !== taskId);
                localStorage.setItem('tasks', JSON.stringify(filteredTasks));
            }
        }

        // --- UI Rendering Function ---
        function displayTask(task) {
            const listItem = document.createElement('li');
            listItem.innerHTML = `
                <span>${task.text}</span>
                <button class="remove-btn">Remove</button>
            `;

            const removeButton = listItem.querySelector('.remove-btn');
            removeButton.onclick = () => removeTask(task._id, listItem); 

            // Add the new task to the top of the list
            taskList.prepend(listItem);
        }
        
        // Allow pressing Enter key to add a task
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); // Prevent default form submit action
                addTask();
            }
        });
    </script>
</body>
</html>
